name: Protected-tag desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify annotated tag, version and main ancestry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_COMMIT"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main

          version="$(python -c 'import runpy; print(runpy.run_path("onepyproject/__init__.py")["__version__"])')"
          test "$TAG" = "v$version"

  tests:
    name: Release source tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install Qt headless runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]' -r packaging/requirements-build.txt
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit release dependencies
        run: |
          pip-audit --strict .
          pip-audit --strict -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: windows-x64
            runner: windows-2022
            architecture: x64
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install clean build dependencies
        run: python -m pip install -e '.[dev]' -r packaging/requirements-build.txt
      - name: Build application
        run: python -m PyInstaller --noconfirm packaging/OnePyProject.spec
      - name: Package and smoke-test extracted application
        run: python packaging/package_artifact.py ${{ matrix.target }}
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OnePyProject-${{ github.ref_name }}-${{ matrix.target }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 5

  attest:
    name: Attest release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: OnePyProject-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*.zip

  publish-draft:
    name: Create draft release
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: OnePyProject-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt
          --draft --verify-tag --title "$TAG" --generate-notes
