[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onepyproject"
version = "0.1.0"
description = "An experimental offline project planner"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8,<6.13", "pymppwriter==0.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
onepyproject = "onepyproject.app:main"

[tool.setuptools.packages.find]
include = ["onepyproject*"]

[tool.setuptools.package-data]
onepyproject = ["assets/flat_color_icons/*.svg", "assets/flat_color_icons/*.txt", "assets/ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
